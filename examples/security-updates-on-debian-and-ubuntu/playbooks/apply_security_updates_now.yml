fleet_stages:
  - id: apply_security_updates_now
    nodes: all
    max_nodes_at_once: "100%"
    node_tasks:
      - shell:
          # The script exits with 2 when the installed packages changed, so
          # that the task reports "changed" only then.
          script: |
            set -e
            apt-get update
            packages_before=$(dpkg-query --show)
            unattended-upgrade
            packages_after=$(dpkg-query --show)
            if [ "$packages_before" != "$packages_after" ]; then exit 2; fi
          dryrun: unattended-upgrade --dry-run
          success_exit_codes: [0, 2]
          changed_when:
            equals: ["{{ .this_node_task.exit_code }}", 2]
