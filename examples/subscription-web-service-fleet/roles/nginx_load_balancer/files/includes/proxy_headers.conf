# Managed by MMX (role nginx_load_balancer). What every application server
# needs to know about the client's request: the name it asked for, the
# client's address, and whether it came over HTTPS.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
