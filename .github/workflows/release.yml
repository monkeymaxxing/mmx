name: Publish release archives

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate the release tag
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from release_archive import development_version, validate_version
          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              sys.exit("Release tag must start with v.")
          version = validate_version(tag[1:])
          if version == development_version():
              sys.exit("The development version cannot be published as a release.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        env:
          GOTOOLCHAIN: auto # Read the toolchain directive, even if the runner sets local.
        with:
          go-version-file: go.mod
          cache: false
      - name: Confirm the pinned Go toolchain
        shell: bash
        run: test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" {print $2}' go.mod)"
      - name: Build and check release archives
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/build-release-archives.py --version "$RELEASE_VERSION" --output-dir "$RUNNER_TEMP/mmx-release-archives"
      - name: Attest every release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/mmx-release-archives/*.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          prerelease=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/mmx-release-archives/"*.tar.gz \
            "$RUNNER_TEMP/mmx-release-archives/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "MMX $RELEASE_VERSION" \
            --generate-notes "${prerelease[@]}"
